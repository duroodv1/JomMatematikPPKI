name: Terbitkan Jom Matematik PPKI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Bina dan semak PWA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Ambil kod sumber
        uses: actions/checkout@v4

      - name: Sediakan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pasang kebergantungan
        run: npm ci

      - name: Bina aplikasi dan sahkan keluaran
        run: npm run build

      - name: Sediakan GitHub Pages
        uses: actions/configure-pages@v5

      - name: Muat naik keluaran laman
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Terbitkan laman
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Terbitkan ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
